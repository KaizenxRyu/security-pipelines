name: Agent boundary security pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Failure, recovery and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Replay the frozen cases before and after enforcement
        run: python -m security_pipelines demo
      - name: Write the job summary
        if: always()
        run: |
          if [ -f artifacts/agent-boundaries/report.md ]; then
            cat artifacts/agent-boundaries/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No replay report. Inspect failed steps; this is not a security pass.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: agent-boundary-report
          path: artifacts/agent-boundaries/
          if-no-files-found: error
          retention-days: 7
